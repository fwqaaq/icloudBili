services:
  bdownloader:
    build: .
    container_name: bdownloader
    restart: unless-stopped
    ports:
      - '${HOST_PORT:-8787}:8787'
    environment:
      - PORT=8787
      - HOST=0.0.0.0
    env_file:
      - path: .env
        required: false
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
